<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — KARIKAALA Management Dashboard</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: 100%; }
  .login-page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--text-primary);
    background:
      radial-gradient(circle at 20% 10%, rgba(74,58,167,.13), transparent 36%),
      radial-gradient(circle at 80% 90%, rgba(27,175,122,.11), transparent 36%),
      var(--surface-0);
  }
  .login-card {
    width: min(100%, 430px);
    padding: 38px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface-1);
    box-shadow: 0 24px 70px rgba(15,23,42,.16);
  }
  .login-card__icon {
    width: 50px; height: 50px;
    display: grid; place-items: center;
    border-radius: 13px;
    color: #fff;
    background: var(--accent);
    margin-bottom: 20px;
    font-size: 22px;
  }
  .login-card__eyebrow { margin: 0 0 7px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .login-card h1 { margin: 0; font-size: 28px; line-height: 1.18; }
  .login-card__subtitle { margin: 10px 0 26px; color: var(--text-muted); line-height: 1.55; font-size: 14px; }
  .login-form { display: grid; gap: 17px; }
  .login-form label { display: grid; gap: 7px; font-size: 13px; font-weight: 700; }
  .login-form input {
    width: 100%; min-height: 46px; padding: 0 13px;
    color: var(--text-primary);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    font-size: 14px;
    font-family: inherit;
  }
  .login-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--series-1-soft); }
  .password-field { position: relative; }
  .password-field input { padding-right: 46px; }
  .password-field button {
    position: absolute; right: 4px; top: 4px;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    color: var(--text-muted);
    background: transparent;
    border: 0;
    cursor: pointer;
    font-size: 16px;
  }
  .login-error { margin: -3px 0 0; color: var(--status-critical); font-size: 13px; }
  .login-submit {
    min-height: 47px;
    color: var(--accent-contrast);
    background: var(--accent);
    border: 0;
    border-radius: 9px;
    font-weight: 800;
    cursor: pointer;
    font-size: 14px;
  }
  .login-submit:disabled { opacity: .65; cursor: wait; }
  .login-card__footer { margin: 22px 0 0; color: var(--text-muted); font-size: 12px; text-align: center; }
  @media (max-width: 520px) { .login-card { padding: 28px 22px; } }
</style>
</head>
<body>
<main class="login-page">
  <section class="login-card">
    <div class="login-card__icon">&#128274;</div>
    <p class="login-card__eyebrow">KARIKAALA</p>
    <h1>Management Dashboard</h1>
    <p class="login-card__subtitle">Sign in to access confidential marketing and OpenTable reports.</p>
    <form class="login-form" id="loginForm">
      <label>Username
        <input id="username" autocomplete="username" placeholder="Enter username" required>
      </label>
      <label>Password
        <div class="password-field">
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
          <button type="button" id="toggleVis" aria-label="Show password">&#128065;</button>
        </div>
      </label>
      <p class="login-error" id="loginError" style="display:none;"></p>
      <button class="login-submit" type="submit" id="submitBtn">Sign in</button>
    </form>
    <p class="login-card__footer">Authorized management access only</p>
  </section>
</main>
<script>
const form = document.getElementById("loginForm");
const errorEl = document.getElementById("loginError");
const submitBtn = document.getElementById("submitBtn");
const passwordInput = document.getElementById("password");
const toggleVis = document.getElementById("toggleVis");

toggleVis.addEventListener("click", () => {
  const showing = passwordInput.type === "text";
  passwordInput.type = showing ? "password" : "text";
  toggleVis.setAttribute("aria-label", showing ? "Show password" : "Hide password");
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "Signing in…";
  try {
    const res = await fetch("/api/site-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: passwordInput.value,
      }),
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || "Unable to sign in.");
    const params = new URLSearchParams(location.search);
    location.href = params.get("next") || "/";
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = "block";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
